# 1. BLOCO DE REDIRECIONAMENTO: Todo tráfego HTTP (80) vai para HTTPS (443)
server {
    listen 80;
    server_name dev.jedieduca.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.jedieduca.com.br;

    # Caminho dos certificados configurados no docker-compose
    ssl_certificate /etc/nginx/certs/jedieduca.com.br.crt;
    ssl_certificate_key /etc/nginx/certs/jedieduca.com.br.key;

    # Otimizações de Segurança SSL (Padrão de Produção)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Configuração de Cabeçalhos para evitar que o PHP e Python se percam
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https; # Avisa que agora é HTTPS!

    # OTIMIZAÇÃO 1: Habilitar compactação Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # OTIMIZAÇÃO 2: Ajustar Buffers do Proxy
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    root /var/www/html;
    index index.php index.html;

    # =========================================================================
    # 🌟 CORRIGIDO: ESCOPOS DO ADIANTI / ADM / MAD (Prioridade Alta)
    # =========================================================================
    # Movidos para cima para garantir que o Adianti funcione antes de cair no escopo global do WP
    
    location /adm {
        try_files $uri $uri/ /adm/index.php?$query_string;
    }

    location /mad {
        try_files $uri $uri/ /mad/index.php?$query_string;
    }

    # Processamento de arquivos PHP EXCLUSIVO para as pastas /adm e /mad (Adianti)
    # O modificador '~ ^/(adm|mad)' garante que o Nginx só usará este FastCGI para sistemas locais
    location ~ ^/(adm|mad).+\.php(/.*)?$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_pass php_cadjedi:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;

        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # =========================================================================
    # PROXY REVERSO PARA O WORDPRESS (Site Principal - Escopo Global)
    # =========================================================================
    # Modificado para capturar tudo que não pertença às outras aplicações específicas
    location / {
        proxy_pass http://wordpress_service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Correção extra para evitar loops de redirecionamento HTTPS no painel do WP
        proxy_redirect off;
    }

    # 🔹 NOVA ROTA: Acesso seguro para o DBA via Proxy Reverso
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin_container/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
    }

    # =========================================================================
    # PROXY REVERSO PARA A API PYTHON (FastAPI)
    # =========================================================================
    location /api/ {
        proxy_pass http://python_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;    
    }

    # ROTA ESTÁTICA ORIGINAL DO PYTHON
    location ^~ /static/ {
        proxy_pass http://python_service:8001/api/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1d;
        access_log off;
    }
    
    # Bloqueia arquivos de configuration sensíveis do Adianti (.ini, .env)
    location ~* \.(env|git|ini|txt|htaccess)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # PROXY REVERSO PARA A APLICAÇÃO NODEJS
    # =========================================================================
    location /node/ {
        rewrite ^/node/(.*)$ /$1 break; 
        
        proxy_pass http://node_service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}