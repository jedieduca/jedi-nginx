#version: '3.8'

services:
  nginx_gateway:
    image: nginx:alpine
    container_name: nginx_gateway
    restart: unless-stopped
    ports:
      - "80:80"   
      - "443:443" 
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../jedi-adianti:/var/www/html 
      - ./certs:/etc/nginx/certs:ro 
      - graficos_data:/var/www/html/mad/app/output/charts:ro
    networks:
      - my-shared-network

# 🔹 COMPLEMENTO CORRIGIDO: Sintaxe moderna e sem erros de YAML
volumes:
  graficos_data:
    name: python_service_graficos_data
    external: true

networks:
  my-shared-network:
    external: true