version: '3.8'

services:
  nginx_gateway:
    image: nginx:alpine
    container_name: nginx_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../jedi-adianti:/var/www/html # 🔹 Volume normal aqui também
      - graficos_data:/var/www/html/mad/app/output/charts:ro
    networks:
      - my-shared-network

volumes:
  graficos_data:
    external:
      name: python_service_graficos_data

networks:
  my-shared-network:
    external: true